a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#menubar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:28px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:9000;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
#menubar div{display:flex;gap:18px;align-items:center}
#menubar b{font-weight:700}
#menubar button{background:none;border:0;cursor:pointer;padding:1px 8px;margin:0 -8px;border-radius:5px;color:#fff;font-size:13px;transition:background .15s}
#menubar button:hover{background:rgba(255,255,255,.25)}
.mk{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.9);color:#222;font:800 10px var(--sans);text-shadow:none}

#wall{display:none;position:fixed;inset:0;place-items:center;pointer-events:none;text-align:center;padding:0 20px}
#wall h1{margin:0;font:800 clamp(3rem,13vw,10rem)/.9 var(--sans);letter-spacing:-.04em;color:rgba(255,255,255,.16);text-transform:uppercase}
#wall p{margin:14px 0 0;color:rgba(255,255,255,.3);font-size:clamp(1rem,2.4vw,1.6rem);font-weight:700}

#icons{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));right:18px;display:flex;flex-direction:column;gap:14px;z-index:1}
.icon{width:84px;text-align:center;text-decoration:none;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.icon i{background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0));border-radius:23%;display:grid;place-items:center;width:56px;height:56px;margin:0 auto 4px;color:#fff;font:700 18px var(--sans);font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(0,0,0,.25);background-repeat:no-repeat;background-position:center;background-size:30px 30px;overflow:hidden}
.icon i img{display:block;width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.icon i.logo-github img{filter:brightness(0) invert(1)}
.icon span{display:inline-block;padding:0 6px;border-radius:5px}
.icon:hover span,.icon:focus-visible span{background:var(--accent)}

.win{position:fixed;background:var(--win);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(0,0,0,.25);border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.25) inset;display:flex;flex-direction:column;max-height:calc(100% - 130px);max-width:calc(100% - 16px)}
.win.max{left:8px!important;top:calc(36px + env(safe-area-inset-top,0px))!important;width:calc(100% - 16px)!important;height:calc(100% - 130px);max-height:none}
.tb{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 13px;background:var(--bar);border-radius:12px 12px 0 0;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.tb span{flex:1;text-align:center;color:var(--mute);font-size:13px;font-weight:600;margin-right:52px}
.tl{width:12px;height:12px;border-radius:50%;border:.5px solid rgba(0,0,0,.2);padding:0;cursor:pointer}
.tl.c{background:#ff5f57}.tl.m{background:#febc2e}.tl.z{background:#28c840}
.bd{padding:22px;overflow:auto}
.bd h2{margin:0 0 4px;font-size:22px}
.bd h3{margin:0 0 2px;font-size:16px}
.bd p{margin:0 0 12px;color:var(--mute)}
.av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#5ac8fa,#5856d6);color:#fff;display:grid;place-items:center;font:700 24px var(--sans);margin-bottom:14px}
.btn{display:inline-block;padding:6px 16px;border-radius:7px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:600;padding:0 8px 8px 0}
td{padding:10px 8px 10px 0;border-top:1px solid var(--line)}
td:first-child{font-weight:700}
.row{padding:14px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chips i{font-style:normal;font-size:12px;padding:1px 10px;background:var(--chip);border-radius:99px}
.hon{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.hon b{min-width:40px}.hon span{color:var(--mute)}.hon strong{display:block;color:var(--fg)}

#dock{--b:54px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;height:calc(var(--b) + 20px);padding:10px 12px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1px solid rgba(255,255,255,.35);border-radius:22px;z-index:9000}
#dock button{position:relative;flex:none;width:var(--b);height:var(--b);border-radius:23%;border:0;cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.45)}
#dock button svg{width:60%;height:60%;display:block}
#dock button.bounce{animation:bounce .7s ease-in-out}
#dock button.on::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:#fff}
#dock [data-o=about]{background:linear-gradient(#f7c982,#e0873a)}
#dock [data-o=stats]{background:linear-gradient(#5fe07a,#1d9f45)}
#dock [data-o=work]{background:linear-gradient(#7fd0ff,#2b86f2)}
#dock [data-o=links]{background:linear-gradient(#ffffff,#d3e4ff)}
#dock [data-o=contact]{background:linear-gradient(#5fc8ff,#0a6df0)}
#dock [data-o=terminal]{background:linear-gradient(#4d4d50,#18181a)}

.win{animation:pop .24s cubic-bezier(.2,.8,.2,1);transition:opacity .2s ease,transform .22s ease}
.win.out{opacity:0;transform:scale(.95)}
.win.mini{opacity:0;transform:translateY(38vh) scale(.15);transition:opacity .26s ease-in,transform .26s cubic-bezier(.5,0,.8,.4)}
.win.anim{transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1)}
.tl{transition:filter .15s}.tl:hover{filter:brightness(.85)}
.btn{transition:filter .15s}.btn:hover{filter:brightness(1.1)}
a{transition:opacity .15s}a:hover{opacity:.75}
.win.dark{background:rgba(28,28,30,.93);border-color:rgba(255,255,255,.14)}
.win.dark .tb{background:#38383a;border-bottom-color:#1a1a1a}
.win.dark .tb span{color:#a1a1a6}
.bd.term{padding:12px 14px;height:min(340px,52vh);color:#e8e8ea;font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;cursor:text}
.term .out div{white-space:pre-wrap;word-break:break-word}
.term .ln{display:flex;gap:8px}
.term .ps{color:#5ac8fa;white-space:nowrap}
.term .dim{color:#9a9aa0}
.term input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;padding:0;caret-color:#fff}

@keyframes pop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media(max-width:700px){
  .win{left:8px!important;top:calc(36px + env(safe-area-inset-top,0px))!important;width:calc(100% - 16px)!important}
  #icons{display:none}.tb{cursor:default}#dock{--b:46px;gap:6px}.term input{font-size:16px}
}
</style>
</head>
<body>
<div id="menubar"><div><span class="mk" id="mk"></span><b id="app"></b><button data-o="about">About</button><button data-o="work">Work</button><button data-o="contact">Contact</button></div><span id="clock"></span></div>
<div id="wall"><div><h1 id="wname"></h1><p id="wrole"></p></div></div>
<div id="icons"></div>
<div id="dock"></div>

<script>
/* ===== EDIT YOUR CONTENT HERE ===== */
const ME = {
  name: "Sahil Adit",
  role: "Computer Engineering Student | Software Developer",
  line: "Building useful software with full-stack engineering, AI, and data-driven systems.",
  skills: ["C++", "Python", "JavaScript", "SQL", "HTML", "CSS", "React.js", "Node.js", "Express.js", "REST APIs", "Socket.IO", "Git", "Data Structures & Algorithms", "OOP", "DBMS", "Operating Systems", "Computer Networks"],
  about: "I'm a Computer Engineering student at AISSMS COE, Pune (2023–2027), interested in software engineering, AI-powered applications, and problem solving.",
  stats: [
    { site: "Codeforces", rating: "1304 peak", solved: "—", rank: "Pupil", url: "https://codeforces.com/profile/Neophron17" },
    { site: "LeetCode", rating: "1641 max", solved: "600+", rank: "Problem Solver", url: "https://leetcode.com/u/sahiladit/" },
    { site: "HackerRank", rating: "—", solved: "—", rank: "5-star C++", url: "https://www.hackerrank.com/" }
  ],
  honors: [
    { year: "2025", title: "COEP i2i Finalist", note: "National innovation challenge for sustainable home automation." },
    { year: "2024", title: "IIT Madras Shastra Finalist", note: "National-level programming contest." },
    { year: "2024", title: "MIT2 Coding Contest — Rank 43", note: "Among international participants." }
  ],
  projects: [
    { title: "Collaborative Code IDE", desc: "Real-time collaborative coding with room-based sessions, live synchronization, and authentication.", tech: ["React.js", "Node.js", "Express.js", "Socket.IO", "Monaco Editor", "Clerk"], url: "https://github.com/sahiladit" },
    { title: "Lawgic AI", desc: "RAG-based legal assistant with semantic retrieval over IPC sections and contextual responses.", tech: ["Python", "RAG", "OpenAI API", "Vector Embeddings", "Chainlit"], url: "https://github.com/sahiladit" },
    { title: "NEXSUS AI", desc: "Agent-based healthcare provider data validation and enrichment pipeline.", tech: ["Python", "FastAPI", "Celery", "Redis", "PostgreSQL"], url: "https://github.com/sahiladit" },
    { title: "Financial Fraud Detection System", desc: "Graph-based detection of suspicious transaction patterns with risk scoring and WebGL visualizations.", tech: ["Next.js", "TypeScript", "Graphology", "WebGL", "Tailwind CSS"], url: "https://github.com/sahiladit" }
  ],
  links: [
    { site: "GitHub", url: "https://github.com/sahiladit" },
    { site: "LinkedIn", url: "https://www.linkedin.com/in/sahiladit/" },
    { site: "LeetCode", url: "https://leetcode.com/u/sahiladit/" },
    { site: "Codeforces", url: "https://codeforces.com/profile/Neophron17" },
    { site: "Codolio", url: "https://codolio.com/profile/sahiladit" }
  ],
  email: "sahilpradipadit@aissmscoe.com",
  contactText: "Open to SDE and AI opportunities, internships, full-time roles, and meaningful engineering collaborations."
};
/* ===== END OF EDITABLE CONTENT ===== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RIGHT_ICON_ORDER = ["Codeforces", "LeetCode", "LinkedIn", "GitHub", "Codolio"];
const allLinks = RIGHT_ICON_ORDER
  .map(site => ME.links.find(link => link.site.toLowerCase() === site.toLowerCase()))
  .filter(Boolean);
const ini = ME.name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();

const APPS = {
  about:  { t:"About Me", e:"👤", w:440, x:70,  y:60,  html:() => `<div class="av">${esc(ini)}</div><h2>${esc(ME.name)}</h2><p>${esc(ME.role)}</p><p style="color:var(--fg)">${esc(ME.line)}</p><p>${esc(ME.about)}</p><a class="btn" href="mailto:${esc(ME.email)}">Email me</a>` },
  stats:  { t:"Career Stats", e:"📊", w:520, x:190, y:130, html:() => `<table><thead><tr><th>Platform</th><th>Rating</th><th>Solved</th><th>Rank</th><th></th></tr></thead><tbody>${ME.stats.map(s=>`<tr><td>${esc(s.site)}</td><td>${esc(s.rating)}</td><td>${esc(s.solved)}</td><td>${esc(s.rank)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">Open</a></td></tr>`).join("")}</tbody></table><h3 style="margin-top:22px">Honors</h3>${ME.honors.map(h=>`<div class="hon"><b>${esc(h.year)}</b><span><strong>${esc(h.title)}</strong>${esc(h.note)}</span></div>`).join("")}` },
  work:   { t:"Projects", e:"📁", w:500, x:130, y:90,  html:() => ME.projects.map(p=>`<div class="row"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><div class="chips">${p.tech.map(t=>`<i>${esc(t)}</i>`).join("")}</div><a href="${esc(p.url)}" target="_blank" rel="noopener">View project</a></div>`).join("") },
  links:  { t:"Links", e:"🔗", w:340, x:250, y:110, html:() => allLinks.map(l=>`<div class="row"><a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.site)}</b></a></div>`).join("") },
  terminal:{ t:"Terminal", e:"⌨️", w:560, x:210, y:70, dark:1, cls:"term", init:termInit, html:() => `<div class="out"></div><div class="ln"><span class="ps"></span><input aria-label="Terminal input" autocomplete="off" autocapitalize="off" spellcheck="false"></div>` },
  contact:{ t:"Contact", e:"✉️", w:380, x:160, y:150, html:() => `<h2>Want me on your team?</h2><p>${esc(ME.contactText)}</p><a class="btn" href="mailto:${esc(ME.email)}">Email me</a> <span style="color:var(--mute);margin-left:8px">${esc(ME.email)}</span>` }
};

const S = (inner) => `<svg viewBox="0 0 32 32" aria-hidden="true">${inner}</svg>`;
const ICON = {
  terminal:S('<path d="M9 11l6 5-6 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 22h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>'),
  about:   S('<circle cx="16" cy="12" r="5" fill="#fff"/><path d="M6 27c0-6 4.5-9 10-9s10 3 10 9z" fill="#fff"/>'),
  stats:   S('<rect x="6" y="17" width="5" height="9" rx="1.2" fill="#fff"/><rect x="13.5" y="11" width="5" height="15" rx="1.2" fill="#fff"/><rect x="21" y="6" width="5" height="20" rx="1.2" fill="#fff"/>'),
  work:    S('<path d="M5 10a2.5 2.5 0 0 1 2.5-2.5h5l2.3 2.7H24.500A2.500 2.500 0 0 1 27 12.700v11.800a2.500 2.500 0 0 1-2.500 2.500h-17A2.500 2.500 0 0 1 5 24.500z" fill="#fff"/>'),
  links:   S('<circle cx="16" cy="16" r="11.500" fill="none" stroke="#0a84ff" stroke-width="2"/><path d="M22 10l-3.500 8.500L10 22l3.500-8.500z" fill="#ff3b30"/><path d="M10 22l3.500-8.500 5 5z" fill="#9aa4b2"/>'),
  contact: S('<rect x="5" y="8.500" width="22" height="15" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M6 11l10 7.500L26 11" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>')
};
function termInit(el){
  const bd = el.querySelector(".bd"), out = bd.querySelector(".out"), inp = bd.querySelector("input"), ps = bd.querySelector(".ps");
  const P = (ME.name.split(" ")[0] || "guest").toLowerCase() + "@portfolio ~ %";
  ps.textContent = P;
  const print = (t, c) => { const d = document.createElement("div"); d.textContent = t; if (c) d.className = c; out.appendChild(d); };
  const pad = (s, n) => String(s).padEnd(n);
  const C = {
    help: () => ["Commands:","  about      who I am","  whoami     name and role","  skills     what I work with","  stats      coding profiles","  honors     wins and titles","  projects   things I built","  links      profile links","  contact    how to reach me","  open <x>   open a window or profile (open stats, open github)","  ls         list windows","  clear      clear the screen"],
    about: () => [ME.about],
    whoami: () => [ME.name + " | " + ME.role, ME.line],
    skills: () => [(ME.skills || []).join("  ")],
    stats: () => [pad("Platform",13)+pad("Rating",8)+pad("Solved",9)+"Rank", ...ME.stats.map(s => pad(s.site,13)+pad(s.rating,8)+pad(s.solved,9)+s.rank)],
    honors: () => ME.honors.map(h => h.year + "  " + h.title + " (" + h.note + ")"),
    projects: () => ME.projects.map(p => pad(p.title,16) + p.desc),
    links: () => allLinks.map(l => pad(l.site,13) + l.url),
    contact: () => [ME.email, ME.contactText],
    ls: () => [Object.keys(APPS).join("  ")],
    date: () => [new Date().toString()],
    echo: a => [a.join(" ")],
    sudo: () => ["Nice try. Nobody out-codes me, even with root."],
    clear: () => { out.innerHTML = ""; return []; },
    open: a => {
      const n = (a[0] || "").toLowerCase();
      if (APPS[n]) { openApp(n); return ["Opening " + n + "..."]; }
      const l = allLinks.find(x => x.site.toLowerCase() === n);
      if (l) { window.open(l.url, "_blank", "noopener"); return ["Opening " + l.site + "..."]; }
      return ["open: " + (n || "missing argument") + ". Try: " + Object.keys(APPS).join(", ")];
    }
  };
  const run = line => {
    const [cmd, ...a] = line.trim().split(/\s+/);
    if (!cmd) return;
    const f = C[cmd.toLowerCase()];
    (f ? f(a) : ["zsh: command not found: " + cmd]).forEach(t => print(t));
  };
  const hist = []; let hi = 0;
  print("Last login: " + new Date().toDateString() + " on ttys001", "dim");
  print('Type "help" to see what I can do.', "dim");
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const v = inp.value; print(P + " " + v); run(v);
      if (v.trim()) hist.push(v);
      hi = hist.length; inp.value = ""; bd.scrollTop = bd.scrollHeight;
    } else if (e.key === "ArrowUp") { if (hi > 0) { hi--; inp.value = hist[hi]; } e.preventDefault(); }
    else if (e.key === "ArrowDown") { if (hi < hist.length) { hi++; inp.value = hist[hi] || ""; } e.preventDefault(); }
  });
  bd.addEventListener("click", () => { if (!String(getSelection())) inp.focus(); });
  if (innerWidth > 700) setTimeout(() => inp.focus(), 60);
}

document.title = ME.name + " | " + ME.role;
$("#app").textContent = ME.name; $("#mk").textContent = ini; $("#wname").textContent = ME.name; $("#wrole").textContent = ME.role;
const COL = {leetcode:"#ffa116",codeforces:"#1f8acb",codechef:"#7a5c48",github:"#24292f",linkedin:"#0a66c2"};
const LOGO = { codolio: "https://codolio.com/favicon.ico",
  leetcode: "https://cdn.simpleicons.org/leetcode/FFA116",
  codeforces: "https://cdn.simpleicons.org/codeforces/FFFFFF",
  linkedin: "https://cdn.simpleicons.org/linkedin/FFFFFF",
  github: "https://cdn.simpleicons.org/github/FFFFFF"
};
$("#icons").innerHTML = allLinks.map(l => {
  const key = l.site.toLowerCase();
  const logo = LOGO[key];
  const iconContent = logo
    ? `<img src="${logo}" alt="" aria-hidden="true" loading="lazy" referrerpolicy="no-referrer">`
    : esc(l.site.slice(0,2));
  return `<a class="icon" href="${esc(l.url)}" target="_blank" rel="noopener"><i class="logo-${key}" style="background-color:${COL[key]||"#6b7280"}" aria-hidden="true">${iconContent}</i><span>${esc(l.site)}</span></a>`;
}).join("");
$("#dock").innerHTML = Object.entries(APPS).sort((a,b) => (a[0]==="terminal") - (b[0]==="terminal")).map(([k,a]) => `<button data-o="${k}" title="${a.t}" aria-label="${a.t}">${ICON[k]}</button>`).join("");

let z = 10;
const front = el => { el.style.zIndex = ++z; };
function sync(){ document.querySelectorAll("#dock button").forEach(b => b.classList.toggle("on", !!$("#w-"+b.dataset.o))); }

function openApp(k){
  let el = $("#w-"+k);
  if (el) { el.classList.remove("mini","out"); el.style.display = "flex"; el.style.animation = "none"; el.offsetWidth; el.style.animation = ""; front(el); return; }
  const db = $(`#dock [data-o="${k}"]`); if (db) { db.classList.add("bounce"); setTimeout(() => db.classList.remove("bounce"), 750); }
  const a = APPS[k], n = document.querySelectorAll(".win").length;
  el = document.createElement("div");
  el.className = "win" + (a.dark ? " dark" : ""); el.id = "w-"+k;
  el.style.cssText = `left:${a.x + n*14}px;top:${a.y + n*14}px;width:${a.w}px`;
  el.innerHTML = `<div class="tb"><button class="tl c" aria-label="Close"></button><button class="tl m" aria-label="Minimise"></button><button class="tl z" aria-label="Zoom"></button><span>${a.t}</span></div><div class="bd ${a.cls || ""}">${a.html()}</div>`;
  document.body.appendChild(el); front(el); sync(); if (a.init) a.init(el);
  el.addEventListener("pointerdown", () => front(el));
  el.querySelector(".c").onclick = () => { el.classList.add("out"); setTimeout(() => { el.remove(); sync(); }, 200); };
  el.querySelector(".m").onclick = () => { el.classList.add("mini"); setTimeout(() => { el.style.display = "none"; el.classList.remove("mini"); }, 260); };
  el.querySelector(".z").onclick = () => { el.classList.add("anim"); el.classList.toggle("max"); setTimeout(() => el.classList.remove("anim"), 320); };
  const tb = el.querySelector(".tb");
  tb.addEventListener("pointerdown", e => {
    if (e.target.closest(".tl") || innerWidth <= 700 || el.classList.contains("max")) return;
    const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
    tb.setPointerCapture(e.pointerId);
    const mv = ev => { el.style.left = Math.max(0, Math.min(innerWidth - 80, ev.clientX - dx)) + "px"; el.style.top = Math.max(28, Math.min(innerHeight - 90, ev.clientY - dy)) + "px"; };
    const up = () => { tb.removeEventListener("pointermove", mv); tb.removeEventListener("pointerup", up); };
    tb.addEventListener("pointermove", mv); tb.addEventListener("pointerup", up);
  });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-o]"); if (b) openApp(b.dataset.o); });


const dock = $("#dock");
const dBtns = [...dock.querySelectorAll("button")];
let mx = null, cur = [], raf = 0;
function dockFrame(){
  const cs = getComputedStyle(dock), b0 = parseFloat(cs.getPropertyValue("--b")) || 54, gap = parseFloat(cs.columnGap) || 8;
  const left = innerWidth / 2 - (dBtns.length * b0 + (dBtns.length - 1) * gap) / 2;
  let busy = false;
  dBtns.forEach((b, i) => {
    const c = left + i * (b0 + gap) + b0 / 2;
    const t = mx === null ? b0 : b0 * (1 + 0.7 * Math.exp(-Math.pow(mx - c, 2) / (2 * 62 * 62)));
    const p = cur[i] == null ? b0 : cur[i];
    cur[i] = p + (t - p) * 0.3;
    if (Math.abs(t - cur[i]) > 0.3) busy = true;
    b.style.width = b.style.height = cur[i] + "px";
  });
  if (busy) raf = requestAnimationFrame(dockFrame);
  else { raf = 0; if (mx === null) { cur = []; dBtns.forEach(b => { b.style.width = b.style.height = ""; }); } }
}
const kick = () => { if (!raf) raf = requestAnimationFrame(dockFrame); };
dock.addEventListener("pointermove", e => { if (e.pointerType === "touch") return; mx = e.clientX; kick(); });
dock.addEventListener("pointerleave", () => { mx = null; kick(); });

const tick = () => { $("#clock").textContent = new Date().toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit"}); };
tick(); setInterval(tick, 20000);

openApp("about");
if (innerWidth > 700) openApp("stats");
</script>
</body>
</html>
